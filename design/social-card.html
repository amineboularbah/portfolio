<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Amine Boularbah sharing card</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url('../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 800;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #fafaf6;
        color: #203238;
        font-family: Manrope, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        isolation: isolate;
      }
      .wash {
        position: absolute;
        top: 0;
        right: 0;
        width: 438px;
        height: 533px;
        background: #eaf1ed;
        z-index: -1;
      }
      .monogram {
        position: absolute;
        left: 63px;
        top: 42px;
        font-size: 52px;
        font-weight: 750;
        letter-spacing: -4px;
      }
      .monogram span {
        color: #087e94;
      }
      .eyebrow {
        position: absolute;
        left: 66px;
        top: 155px;
        margin: 0;
        color: #63716f;
        text-transform: uppercase;
        font-size: 13px;
        letter-spacing: 2.3px;
        font-weight: 650;
      }
      h1 {
        position: absolute;
        left: 60px;
        top: 210px;
        margin: 0;
        font-size: 78px;
        line-height: 1.06;
        letter-spacing: -4px;
        font-weight: 650;
      }
      h1 span {
        color: #087e94;
      }
      .role {
        position: absolute;
        left: 65px;
        top: 392px;
        margin: 0;
        font-size: 28px;
        color: #087e94;
        font-weight: 550;
        letter-spacing: -0.7px;
      }
      .expertise {
        position: absolute;
        left: 66px;
        top: 444px;
        margin: 0;
        color: #63716f;
        font-size: 18px;
      }
      .portrait {
        position: absolute;
        top: 65px;
        right: 72px;
        width: 357px;
        height: 416px;
        margin: 0;
        padding: 10px;
        background: #fff;
        border: 1px solid #dfe5df;
        border-radius: 17px;
        transform: rotate(3deg);
        box-shadow: 0 18px 36px #20323816;
      }
      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 51% 45%;
        border-radius: 9px;
        display: block;
      }
      footer {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 533px;
        height: 97px;
        border-top: 1px solid #dfe5df;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .domain {
        font-size: 23px;
        font-weight: 650;
        letter-spacing: -0.5px;
      }
      .location {
        font-size: 16px;
        color: #63716f;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="wash"></div>
      <div class="monogram">ab<span>.</span></div>
      <p class="eyebrow">Independent mobile engineering</p>
      <h1>Amine<br />Boularbah<span>.</span></h1>
      <p class="role">Lead Mobile Engineer</p>
      <p class="expertise">Flutter · Architecture · Native integrations</p>
      <figure class="portrait">
        <img src="../src/assets/me.webp" alt="Amine Boularbah" />
      </figure>
      <footer>
        <span class="domain">amineboularbah.com</span>
        <span class="location">Málaga, Spain · Working worldwide</span>
      </footer>
    </main>
  </body>
</html>
